name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # gcc on macOS is an alias for Apple Clang
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DARG_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Completion scripts in real shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh fish
          out="$RUNNER_TEMP/completion"
          mkdir -p "$out/play/sub.d"
          touch "$out/play/file1.txt"
          ARG_COMPLETION_OUT_DIR="$out" build/tests/test_complete
          for f in "$out"/*.sh; do bash -n "$f"; done
          for f in "$out"/*.zsh; do zsh -n "$f"; done
          for f in "$out"/*.fish; do fish -n "$f"; done
          cd "$out/play"
          # bash: simulate completions with COMP_WORDS / COMP_CWORD
          cat > ../sim.bash <<'EOF'
          source "$1"
          fail=0 n=0
          t() {
          	local want="$1"; shift
          	n=$((n + 1))
          	COMP_WORDS=("$@")
          	COMP_CWORD=$((${#COMP_WORDS[@]} - 1))
          	COMPREPLY=()
          	_pkg
          	local got="${COMPREPLY[*]}"
          	if [[ "$got" != "$want" ]]; then
          		echo "FAIL: '$*' -> '$got' (want '$want')"
          		fail=1
          	fi
          }
          t "repo r" pkg r
          t "add" pkg repo a
          t "list ls" pkg r l
          t "--all" pkg -v r ls --a
          t "--verbose --version" pkg repo add --ver
          t "json yaml" pkg -f ""
          t "yaml" pkg -vf y
          t "main extra" pkg repo add ""
          t "" pkg repo add main ""
          t "sub.d" pkg build s
          t "file1.txt" pkg install -o f
          t "sub.d" pkg --workdir s
          t "yaml" pkg --format = y
          t "--format=json" pkg --format=j
          t "--when=now" pkg --when=n
          t "" pkg -j ""
          t "install" pkg -C x ins
          t "--no-color" pkg --no
          echo "bash: $n completions checked, fail=$fail"
          exit $fail
          EOF
          bash ../sim.bash ../bash.sh
          # fish: ask fish itself for the candidates
          cat > ../sim.fish <<'EOF'
          source $argv[1]
          set -g fail 0
          set -g n 0
          function t
          	set -g n (math $n + 1)
          	set -l got (complete -C $argv[2] | string replace -r '\t.*' '' | sort | string join ' ')
          	if test "$got" != "$argv[1]"
          		echo "FAIL: '$argv[2]' -> '$got' (want '$argv[1]')"
          		set -g fail 1
          	end
          end
          t 'r repo' 'pkg r'
          t 'add list ls' 'pkg repo '
          t 'list ls' 'pkg r l'
          t 'json yaml' 'pkg --format '
          t 'json yaml' 'pkg -vf '
          t 'extra main' 'pkg repo add '
          t '' 'pkg repo add main '
          t 'build install r repo' 'pkg -C x '
          t '--no-color' 'pkg --no'
          t '--all' 'pkg repo ls --a'
          t '--verbose' 'pkg -v repo ls --verb'
          t 'file1.txt sub.d/' 'pkg install '
          echo "fish: $n completions checked, fail=$fail"
          exit $fail
          EOF
          fish ../sim.fish ../fish.fish
          # zsh: the script loads and defines its functions
          zsh -fc 'autoload -U compinit && compinit -u -D &&
            source ../zsh.zsh && (( $+functions[_pkg_5] ))' &&
            echo "zsh: script loads"
      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/prefix"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DARG_WERROR=ON
          -DARG_SANITIZE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  strict-c99:
    name: Strict C99 (${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [c99, c11, c17]
    steps:
      - uses: actions/checkout@v4
      - name: Public header compiles under -std=${{ matrix.std }} -pedantic-errors
        run: |
          printf '#include "arg.h"\nint main(void) { return arg_version() == 0; }\n' > hdr.c
          for cc in gcc clang; do
            $cc -std=${{ matrix.std }} -pedantic-errors -Wall -Wextra -Werror \
                -Iinclude -c hdr.c -o hdr.o
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pipx install gcovr
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Debug
          -DARG_COVERAGE=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          gcovr --root . --filter src/ build \
                --print-summary --txt coverage.txt \
                --markdown coverage.md
          cat coverage.txt
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

  style:
    name: Coding style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux kernel style checks
        run: ./scripts/check-style.sh
